# Параметры сервиса. Секретный ключ хранится в .env, не в этом файле.

server:
  host: "127.0.0.1"
  port: 8000

llm:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 300
  timeout_seconds: 15
  max_attempts: 3
  retry_base_delay_seconds: 0.5

cache:
  ttl_seconds: 600

validation:
  max_message_length: 1000

logging:
  file: "logs/service.log"
  level: "INFO"
